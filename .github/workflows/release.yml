name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm test && pnpm build:pages
      - name: Package artifacts
        run: |
          tar -czf "access-verdict-site-${GITHUB_REF_NAME}.tar.gz" -C dist .
          git archive --format=tar.gz --output "access-verdict-source-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" access-verdict-*.tar.gz --verify-tag --generate-notes --title "Access Verdict $GITHUB_REF_NAME"
